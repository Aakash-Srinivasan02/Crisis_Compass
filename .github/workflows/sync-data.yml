name: Sync Real-Time Data from National APIs

on:
  - schedule:
      # Run daily at 2 AM UTC (adjust as needed)
      - cron: '0 2 * * *'
  # Allow manual trigger from Actions tab
  - workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Run ETL Script
        env:
          SAMHSA_API_KEY: ${{ secrets.SAMHSA_API_KEY }}
          HUD_API_KEY: ${{ secrets.HUD_API_KEY }}
          CRISIS_API_KEY: ${{ secrets.CRISIS_API_KEY }}
        run: node backend/etl.js
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet resources.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "bot@crisiscompass.org"
          git config --local user.name "Crisis Compass Data Bot"
          git add resources.json
          git commit -m "🤖 Auto: Update resources from national APIs"
          git push
      
      - name: Log sync completion
        run: |
          echo "✅ Data sync completed at $(date)"
          echo "Resources updated: ${{ steps.changes.outputs.changed }}"
